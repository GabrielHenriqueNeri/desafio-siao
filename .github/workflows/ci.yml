name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend â€” build e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependÃªncias
        run: npm ci
      - name: Compilar
        run: npm run build
      - name: Testes unitÃ¡rios
        run: npm test

  frontend:
    name: Frontend â€” typecheck e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependÃªncias
        run: npm ci
      - name: Compilar (tsc + vite)
        run: npm run build
